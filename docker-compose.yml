services:
  gravitino:
    image: apache/gravitino:1.3.0
    ports:
      - "8090:8090"
      - "9001:9001"
    environment:
      GRAVITINO_SERVER_HTTP_PORT: 8090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  test:
    image: golang:1.26.4
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    working_dir: /app
    command:
      - bash
      - -c
      - |
        go mod download && go mod verify
        go test -v -cover -timeout 30m ./internal/...
    environment:
      TF_ACC: "1"
      GRAVITINO_URI: "http://gravitino:8090"
      GRAVITINO_AUTH: "none"
      GRAVITINO_USERNAME: ""
      GRAVITINO_PASSWORD: ""
      GRAVITINO_OAUTH_TOKEN: ""
    depends_on:
      gravitino:
        condition: service_healthy

volumes:
  go-modules:
